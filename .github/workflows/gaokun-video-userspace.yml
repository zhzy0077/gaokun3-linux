name: Build isolated V4L2 DRM PRIME userspace

on:
  workflow_dispatch:
  push:
    branches: [iris-sc8280xp]
    paths: [.github/workflows/gaokun-video-userspace.yml, tools/video/ffmpeg-v4l2-vp9.patch]

permissions:
  contents: read

jobs:
  ffmpeg:
    runs-on: ubuntu-24.04-arm
    env:
      FFMPEG_REF: f60aae17021abae85b1ba9759e8b2da33f723902
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: jc-kynesim/rpi-ffmpeg
          ref: ${{ env.FFMPEG_REF }}
          path: ffmpeg-source
          fetch-depth: 1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libdrm-dev
      - name: Build shared libraries and test executable
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ffmpeg-stage"
          cd ffmpeg-source
          patch -p1 --fuzz=0 < "$GITHUB_WORKSPACE/tools/video/ffmpeg-v4l2-vp9.patch"
          ./configure --prefix="$GITHUB_WORKSPACE/ffmpeg-stage" \
            --enable-shared --disable-static --disable-autodetect \
            --enable-libdrm --enable-v4l2-m2m --enable-pthreads --disable-doc --disable-debug \
            --disable-ffplay --disable-ffprobe --disable-v4l2-request --disable-sand
          for codec in H264 HEVC VP9; do
            grep -q "#define CONFIG_${codec}_V4L2M2M_DECODER 1" config_components.h
          done
          make -j"$(nproc)"
          make install
      - name: Verify decoder DRM PRIME capabilities
        run: |
          set -euxo pipefail
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/ffmpeg-stage/lib"
          ffmpeg-stage/bin/ffmpeg -version > ffmpeg-stage/build-version.txt
          for codec in h264 hevc vp9; do
            ffmpeg-stage/bin/ffmpeg -hide_banner -h "decoder=${codec}_v4l2m2m" \
              > "ffmpeg-stage/${codec}-capabilities.txt" 2>&1
          done
          python3 tools/video/check-ffmpeg-drm.py > ffmpeg-stage/drm-capabilities.json
          printf '%s\n' "$FFMPEG_REF" > ffmpeg-stage/source-commit.txt
          cp ffmpeg-source/ffbuild/config.log ffmpeg-stage/config.log
          cp tools/video/ffmpeg-v4l2-vp9.patch ffmpeg-stage/
          git rev-parse HEAD > ffmpeg-stage/integration-commit.txt
          cp ffmpeg-source/COPYING.LGPLv2.1 ffmpeg-stage/
          tar -C ffmpeg-stage -cJf ffmpeg-v4l2-drm-arm64.tar.xz .
          sha256sum ffmpeg-v4l2-drm-arm64.tar.xz > ffmpeg-v4l2-drm-arm64.tar.xz.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-v4l2-drm-arm64
          path: |
            ffmpeg-v4l2-drm-arm64.tar.xz
            ffmpeg-v4l2-drm-arm64.tar.xz.sha256
