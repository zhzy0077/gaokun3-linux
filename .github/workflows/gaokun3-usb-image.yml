name: Build Fedora Live USB Image - Gaokun3

on:
  workflow_dispatch:
    inputs:
      package_release:
        description: Existing RPM release tag containing standard + EL2 packages
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-usb:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      PACKAGE_RELEASE: ${{ inputs.package_release }}
      FEDORA_IMAGE: Fedora-Workstation-Live-45-1.4.aarch64.iso
      FEDORA_IMAGE_SHA256: ad73a977709d417f5b7dda4147fc071396b9d8d2bdcca2df615aa3aab7673710
    steps:
      - uses: actions/checkout@v6

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools erofs-utils parted policycoreutils rsync xz-utils util-linux
          mkdir -p work/rpms output

      - name: Download matching RPMs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Allow dispatch while the selected RPM build is publishing its release.
          for attempt in $(seq 1 40); do
            if gh release download "$PACKAGE_RELEASE" --pattern package-manifest.json --dir work --clobber; then
              break
            fi
            if [[ "$attempt" == 40 ]]; then
              echo "RPM release manifest did not become available" >&2
              exit 1
            fi
            echo "Waiting for RPM release $PACKAGE_RELEASE ($attempt/40)"
            sleep 30
          done
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          manifest = json.loads(pathlib.Path('work/package-manifest.json').read_text())
          assert manifest['package_release_tag'] == os.environ['PACKAGE_RELEASE']
          assert manifest['build_el2'] is True
          packages = manifest['kernels']['el2']['packages']
          names = [packages['kernel'], packages['kernel_modules'],
                   manifest['packages']['firmware'], manifest['packages']['platform'],
                   manifest['packages']['fingerprint']]
          assert len(set(names)) == 5
          for name in names:
              assert pathlib.Path(name).name == name and name.endswith('.rpm')
              subprocess.run(['gh', 'release', 'download', os.environ['PACKAGE_RELEASE'],
                              '--pattern', name, '--dir', 'work/rpms'], check=True)
          PY

      - name: Download and verify Fedora Live ISO
        run: |
          curl --fail --location --retry 3 \
            "https://dl.fedoraproject.org/pub/fedora/linux/releases/45/Workstation/aarch64/iso/$FEDORA_IMAGE" \
            -o "work/$FEDORA_IMAGE"
          printf '%s  %s\n' "$FEDORA_IMAGE_SHA256" "work/$FEDORA_IMAGE" | sha256sum --check

      - name: Rebuild Fedora Live system on native ARM
        run: |
          sudo tools/usb/build-live-image.sh "work/$FEDORA_IMAGE" work/rpms output/fedora-gaokun3-usb.raw
          sudo rm "work/$FEDORA_IMAGE"
          sudo chown "$(id -u):$(id -g)" output/fedora-gaokun3-usb.raw

      - name: Compress and checksum the disk image
        run: |
          xz -T2 -3 output/fedora-gaokun3-usb.raw
          (cd output && sha256sum fedora-gaokun3-usb.raw.xz > SHA256SUMS)
          cp work/package-manifest.json output/
          printf 'Image tooling commit: %s\nRPM release: %s\nFedora image SHA256: %s\n' \
            "$GITHUB_SHA" "$PACKAGE_RELEASE" "$FEDORA_IMAGE_SHA256" > output/image-build.txt

      - name: Prepare release assets below the per-file limit
        run: |
          python3 tools/usb/package-image.py output/fedora-gaokun3-usb.raw.xz
          cp tools/usb/join-image.sh tools/usb/join-image.ps1 output/
          rm output/fedora-gaokun3-usb.raw.xz

      - name: Publish USB image release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="gaokun3-usb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > work/release-notes.md <<'NOTES'
          Fedora 45 Workstation Live installer for the Gaokun3.

          Download all numbered image parts, SHA256SUMS, SHA256SUMS.parts, and
          the join script for your OS into one directory. Run join-image.ps1
          on Windows or `bash join-image.sh` on Linux/macOS, then flash the
          resulting fedora-gaokun3-usb.raw.xz with balenaEtcher.

          See docs/install-fedora.md for installation and internal-disk migration.
          Boot the Live USB on the Gaokun3, then launch Install Fedora. The
          included Anaconda post-script finalizes the Gaokun boot files on the
          selected internal disk.
          NOTES
          gh release create "$tag" output/* --target "$GITHUB_SHA" \
            --title "Fedora 45 Live USB - Gaokun3 ($GITHUB_RUN_NUMBER)" \
            --notes-file work/release-notes.md
          printf 'USB image release: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
