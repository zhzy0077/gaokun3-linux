[Unit]
Wants=gaokun3-fingerprint-selinux.service
After=gaokun3-fingerprint-selinux.service

[Service]
Environment=LD_LIBRARY_PATH=/opt/gaokun3-fingerprint/libfprint/lib64
Environment=FP_FTE7001_QTEE=enabled
DeviceAllow=/dev/tee0 rw
DeviceAllow=char-gpiochip rw
ReadWritePaths=/var/lib/gaokun3-fingerprint/secure-files
